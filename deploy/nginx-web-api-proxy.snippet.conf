# Add this location block inside the moonsjob.com / www server { } that
# currently proxies to Next on :3000. Same-origin /api keeps auth cookies
# first-party so refresh survives page reload.

# Inside: server_name moonsjob.com www.moonsjob.com;

    client_max_body_size 260m;

    location /api/ {
        proxy_pass http://127.0.0.1:3001/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        client_max_body_size 260m;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_cache_bypass $http_upgrade;
    }

# Then in apps/web/.env.local on the server set:
#   NEXT_PUBLIC_API_URL=https://www.moonsjob.com/api/v1
# (or https://moonsjob.com/api/v1 — must match the site users open)
# Keep api.moonsjob.com for the mobile app.
