# /etc/nginx/sites-available/api.moonsjob.com
# Post media allows up to 250MB videos — nginx default (1m) causes opaque CORS failures.

server {
    server_name api.moonsjob.com;

    client_max_body_size 260m;
    client_body_timeout 300s;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    listen 443 ssl;
    # managed by Certbot — keep your existing ssl_certificate lines
}

server {
    if ($host = api.moonsjob.com) {
        return 301 https://$host$request_uri;
    }

    listen 80;
    server_name api.moonsjob.com;
    return 404;
}
